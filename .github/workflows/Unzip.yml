name: Unzip MMORPG Brain

on:
  push:
    branches: [ main ]

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip file
        run: unzip -o mmodownload_brain_merged.zip

      - name: Show files
        run: ls -R
